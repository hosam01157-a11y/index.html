<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>مؤشر كتلة الجسم (BMI)</title>
</head>
<body>
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>الواجهة</title>
        <link rel="stylesheet" href="style.css">
</head>

<body>

        <div class="card">
                <div class="card-header">
                        <h2>مؤشر كتلة الجسم (BMI)</h2>
                        <p>أدخل البيانات المطلوبة للحصول على النتيجة</p>
                </div>

                <div class="form-group" >
                        <div class="input-field">
                                <label for="input1">الطول بالمتر</label>
                                <input type="text" id="input1" placeholder="ادخل طولك..." />
                        </div>

                        <div class="input-field">
                                <label for="input2">الوزن بالكيلوجرام</label>
                                <input type="text" id="input2" placeholder="ادخل وزنك..." />
                        </div>

                        <button type="submit" id="submit-btn">احسب النتيجة</button>
                </div>

                <div class="output-container">
                        <div class="output-number">
                                <span class="output-label">النتيجة الرقمية:</span>
                                <span id="number-value"></span>
                        </div>

                        <div class="divider"></div>

                        <div class="output-text">
                                <span class="output-label">التقرير / الحالة:</span>
                                <span id="text-value"></span>
                        </div>
                </div>
        </div>

</body>

</html>
</body>

<script>
        
           document.getElementById("submit-btn").addEventListener("click" , function(){

                   let input1 = document.getElementById("input1").value
                   let input2 = document.getElementById("input2").value

                   let bmi= input2/(input1*input1)
                  
                    document.getElementById("number-value").innerHTML=bmi

                    let bmicategory="NAN"

                    if (!input1 || !input2) {
                        alert("برجاء إدخال الطول والوزن بشكل صحيح!");
                        return;
                        }

                    if(bmi<18.5){
                        bmicategory="نحافة (وزن أقل من الطبيعي)."
                    }
                    else if(bmi>18.5 && bmi <=24.9){
                           bmicategory = "وزن طبيعي وصحي. "
                   }
                   else if (bmi >24.9  && bmi <=29.9 ){
                           bmicategory = "زيادة في الوزن (زيادة خفيفة)."

                   }
                   else if (bmi >29.9  && bmi <=34.9 ) {
                           bmicategory = "سمنة من الدرجة الأولى."

                   }
                   else if (bmi > 34.9 && bmi <= 39.9) {
                                   bmicategory= "سمنة من الدرجة الثانية."

                           }
                   else if (bmi > 39.9) {
                                   bmicategory = "سمنة مفرطة (الدرجة الثالثة)."

                           }
                           document.getElementById("text-value").innerHTML = bmicategory
              
               })
</script>
</html>
